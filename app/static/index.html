<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fallen Responder Memorial Wall | National Emergency Services Memorial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-gold: #e5c07b;
      --accent-blue: #4d93ff;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --font-serif: 'Cinzel', serif;
      --font-sans: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(29, 44, 76, 0.4) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(45, 20, 50, 0.3) 0px, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 3rem 1.5rem 2rem;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
    }

    header h1 {
      font-family: var(--font-serif);
      font-size: 2.5rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 650px;
      margin: 0 auto;
    }

    .container {
      max-width: 1250px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Controls: Search & Category Tabs */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .search-box {
      width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 0.9rem 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      backdrop-filter: blur(8px);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px rgba(229, 192, 123, 0.15);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tab-btn {
      padding: 0.6rem 1.2rem;
      border-radius: 30px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
      font-weight: 600;
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.75rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.75rem;
      backdrop-filter: blur(12px);
      transition: transform 0.25s ease, border-color 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(229, 192, 123, 0.4);
    }

    .card-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .badge-LAW_ENFORCEMENT { background: rgba(77, 147, 255, 0.2); color: #66b0ff; border: 1px solid rgba(77, 147, 255, 0.3); }
    .badge-FIRE { background: rgba(255, 99, 99, 0.2); color: #ff8080; border: 1px solid rgba(255, 99, 99, 0.3); }
    .badge-EMS { background: rgba(87, 217, 141, 0.2); color: #6ee7a0; border: 1px solid rgba(87, 217, 141, 0.3); }
    .badge-RESCUE { background: rgba(255, 179, 71, 0.2); color: #ffc266; border: 1px solid rgba(255, 179, 71, 0.3); }
    .badge-K9 { background: rgba(245, 213, 107, 0.2); color: #ffe073; border: 1px solid rgba(245, 213, 107, 0.3); }
    .badge-DISPATCH { background: rgba(192, 132, 252, 0.2); color: #d8b4fe; border: 1px solid rgba(192, 132, 252, 0.3); }
    .badge-OTHER { background: rgba(156, 163, 175, 0.2); color: #d1d5db; border: 1px solid rgba(156, 163, 175, 0.3); }

    .card h3 {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      color: var(--accent-gold);
      margin-bottom: 0.4rem;
    }

    .card .agency {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .card .summary {
      font-size: 0.95rem;
      color: #c9d1d9;
      margin-bottom: 1.25rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1rem;
    }

    .candle-btn {
      background: rgba(229, 192, 123, 0.15);
      border: 1px solid rgba(229, 192, 123, 0.4);
      color: var(--accent-gold);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .candle-btn:hover {
      background: var(--accent-gold);
      color: #000;
    }

    .details-btn {
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: underline;
    }

    .details-btn:hover {
      color: var(--text-main);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #12161f;
      border: 1px solid var(--accent-gold);
      border-radius: 20px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1.25rem; right: 1.25rem;
      background: none; border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .verse-box {
      background: rgba(229, 192, 123, 0.08);
      border-left: 4px solid var(--accent-gold);
      padding: 1rem;
      border-radius: 4px;
      margin: 1.25rem 0;
      font-style: italic;
    }

    .condolence-form {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .condolence-form input, .condolence-form textarea {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem;
      color: var(--text-main);
      outline: none;
    }

    .submit-btn {
      background: var(--accent-gold);
      color: #000;
      font-weight: 700;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>National Fallen Responder Memorial Wall</h1>
    <p>Honoring the brave Law Enforcement, Firefighters, EMS, K9, and Emergency Responders who made the ultimate sacrifice.</p>
  </header>

  <div class="container">
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Search by responder name, agency, or state..." onkeyup="filterCards()">
      </div>
      <div class="tabs" id="categoryTabs">
        <button class="tab-btn active" onclick="setCategory('ALL')">All Responders</button>
        <button class="tab-btn" onclick="setCategory('LAW_ENFORCEMENT')">Law Enforcement</button>
        <button class="tab-btn" onclick="setCategory('FIRE')">Fire Service</button>
        <button class="tab-btn" onclick="setCategory('EMS')">EMS & Paramedics</button>
        <button class="tab-btn" onclick="setCategory('RESCUE')">Rescue Units</button>
        <button class="tab-btn" onclick="setCategory('K9')">K9 Heroes</button>
        <button class="tab-btn" onclick="setCategory('DISPATCH')">911 Dispatch</button>
      </div>
    </div>

    <div class="grid" id="memorialGrid">
      <!-- Dynamically populated -->
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    let allRecords = [];
    let currentCategory = 'ALL';

    async function loadMemorials() {
      try {
        const res = await fetch('/responders?api_key=memorial_secret_admin_key_2026');
        if (res.ok) {
          const data = await res.json();
          allRecords = data.records || [];
        } else {
          // Fallback fetch public latest or empty
          const latestRes = await fetch('/latest');
          if (latestRes.ok) {
            const rec = await latestRes.json();
            allRecords = [rec];
          }
        }
        renderCards();
      } catch (err) {
        console.error("Failed to load memorials:", err);
      }
    }

    function renderCards() {
      const grid = document.getElementById('memorialGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = allRecords.filter(r => {
        const matchesCat = currentCategory === 'ALL' || r.category === currentCategory;
        const matchesSearch = (r.name || '').toLowerCase().includes(search) || 
                              (r.agency || '').toLowerCase().includes(search) || 
                              (r.summary || '').toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted);">No memorial records found.</p>`;
        return;
      }

      filtered.forEach(r => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <span class="card-badge badge-${r.category}">${r.category.replace('_', ' ')}</span>
            <small style="float: right; color: var(--text-muted);">ID #${r.id}</small>
            <h3>${r.name}</h3>
            <div class="agency">🏛️ ${r.agency} ${r.date_of_death ? '• EOW: ' + r.date_of_death : ''}</div>
            <div class="summary">${r.ai_memorial_text || r.summary || ''}</div>
          </div>
          <div class="card-footer">
            <button class="candle-btn" onclick="lightCandle(${r.id}, event)">🕯️ Light Candle (<span id="candle-${r.id}">${r.candle_count || 0}</span>)</button>
            <button class="details-btn" onclick="openDetails(${r.id})">View Tribute 📖</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function lightCandle(id, event) {
      event.stopPropagation();
      try {
        const res = await fetch(`/responders/${id}/candle`, { method: 'POST' });
        if (res.ok) {
          const data = await res.json();
          document.getElementById(`candle-${id}`).innerText = data.candle_count;
        }
      } catch (err) {
        console.error("Candle error:", err);
      }
    }

    function openDetails(id) {
      const rec = allRecords.find(r => r.id === id);
      if (!rec) return;

      const content = document.getElementById('modalContent');
      content.innerHTML = `
        <h2 style="font-family: var(--font-serif); color: var(--accent-gold);">${rec.name}</h2>
        <p style="color: var(--text-muted); margin-bottom: 1rem;">${rec.agency} • Sequential Memorial ID: #${rec.id}</p>
        
        <p>${rec.ai_memorial_text || rec.summary}</p>
        
        ${rec.bible_verse ? `
          <div class="verse-box">
            "${rec.bible_verse}"<br>
            <strong>— ${rec.bible_reference}</strong>
          </div>
        ` : ''}

        <div style="margin-top: 1.5rem;">
          <h4>🕯️ Leave a Condolence Message</h4>
          <form class="condolence-form" onsubmit="submitCondolence(${rec.id}, event)">
            <input type="text" id="authorInput" placeholder="Your Name or Department" required>
            <textarea id="msgInput" rows="3" placeholder="Leave a respectful message of tribute..." required></textarea>
            <button type="submit" class="submit-btn">Post Condolence</button>
          </form>
        </div>
      `;

      document.getElementById('detailModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    async function submitCondolence(id, event) {
      event.preventDefault();
      const author = document.getElementById('authorInput').value;
      const message = document.getElementById('msgInput').value;

      try {
        const res = await fetch(`/responders/${id}/condolences`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ author_name: author, message: message })
        });
        if (res.ok) {
          alert('Thank you. Your condolence message has been posted.');
          closeModal();
        }
      } catch (err) {
        console.error("Condolence error:", err);
      }
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderCards();
    }

    function filterCards() {
      renderCards();
    }

    window.onload = loadMemorials;
  </script>
</body>
</html>
