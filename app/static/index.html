<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>National Fallen Responder Memorial Wall & Interactive Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 24, 36, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --gold: #e5c07b;
      --gold-glow: rgba(229, 192, 123, 0.3);
      --blue: #4d93ff;
      --text: #f0f6fc;
      --muted: #8b949e;
      --font-serif: 'Cinzel', serif;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(30, 45, 80, 0.45) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(60, 20, 70, 0.35) 0px, transparent 50%);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 3rem 1.5rem 2rem;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      background: rgba(10, 14, 22, 0.6);
    }

    header h1 {
      font-family: var(--font-serif);
      font-size: 2.6rem;
      color: var(--gold);
      letter-spacing: 3px;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      text-shadow: 0 0 20px var(--gold-glow);
    }

    header p {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 700px;
      margin: 0 auto;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .view-toggles {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .toggle-btn {
      padding: 0.75rem 1.5rem;
      border-radius: 30px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .toggle-btn.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
      box-shadow: 0 0 15px var(--gold-glow);
    }

    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1.5rem;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 1.05rem;
      backdrop-filter: blur(10px);
      outline: none;
    }

    .chips-container { display: flex; flex-wrap: wrap; gap: 0.6rem; }

    .chip-btn {
      padding: 0.6rem 1.1rem;
      border-radius: 30px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
    }

    .chip-btn.active, .chip-btn:hover {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 2rem;
    }

    .memorial-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.85rem;
      backdrop-filter: blur(14px);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .category-tag {
      display: inline-block;
      padding: 0.3rem 0.85rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .tag-LAW_ENFORCEMENT { background: rgba(77, 147, 255, 0.2); color: #66b0ff; border: 1px solid rgba(77, 147, 255, 0.3); }
    .tag-FIRE { background: rgba(255, 99, 99, 0.2); color: #ff8080; border: 1px solid rgba(255, 99, 99, 0.3); }
    .tag-EMS { background: rgba(87, 217, 141, 0.2); color: #6ee7a0; border: 1px solid rgba(87, 217, 141, 0.3); }
    .tag-K9 { background: rgba(245, 213, 107, 0.2); color: #ffe073; border: 1px solid rgba(245, 213, 107, 0.3); }

    .memorial-card h3 { font-family: var(--font-serif); font-size: 1.4rem; color: var(--gold); margin-bottom: 0.4rem; }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1.1rem;
    }

    .candle-button {
      background: rgba(229, 192, 123, 0.15);
      border: 1px solid rgba(229, 192, 123, 0.4);
      color: var(--gold);
      padding: 0.55rem 1.1rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    #mapContainer {
      height: 550px;
      border-radius: 20px;
      border: 1px solid var(--gold);
      box-shadow: 0 0 30px var(--gold-glow);
      display: none;
    }

    .drawer-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 1.5rem;
    }

    .drawer-overlay.active { opacity: 1; pointer-events: auto; }

    .drawer-card {
      background: #11151e;
      border: 1px solid var(--gold);
      box-shadow: 0 0 40px var(--gold-glow);
      border-radius: 24px;
      max-width: 750px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2.25rem;
      position: relative;
    }

    .drawer-close { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>National Fallen Responder Memorial & Map</h1>
    <p>Honoring Law Enforcement, Firefighters, EMS, Rescue, K9 Heroes, and Dispatchers who made the ultimate sacrifice.</p>
  </header>

  <div class="container">
    <div class="view-toggles">
      <button class="toggle-btn active" onclick="switchView('cards', this)">📜 Honor Roll Cards View</button>
      <button class="toggle-btn" onclick="switchView('map', this)">🗺️ Interactive National Memorial Map</button>
    </div>

    <div class="controls-wrapper" id="controlsBar">
      <input type="text" class="search-input" id="searchBox" placeholder="🔍 Search by responder name, department agency, or state..." onkeyup="filterWall()">
      
      <div class="chips-container">
        <button class="chip-btn active" onclick="selectCategory('ALL')">All Responders</button>
        <button class="chip-btn" onclick="selectCategory('LAW_ENFORCEMENT')">Law Enforcement</button>
        <button class="chip-btn" onclick="selectCategory('FIRE')">Fire Service</button>
        <button class="chip-btn" onclick="selectCategory('EMS')">EMS & Paramedics</button>
        <button class="chip-btn" onclick="selectCategory('K9')">K9 Heroes</button>
      </div>
    </div>

    <!-- Cards Grid -->
    <div class="grid" id="wallGrid"></div>

    <!-- Map View -->
    <div id="mapContainer"></div>
  </div>

  <!-- Detail Drawer Modal -->
  <div class="drawer-overlay" id="drawerModal">
    <div class="drawer-card">
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
      <div id="drawerHeader"></div>
      <div id="drawerBody" style="margin-top: 1.5rem;"></div>
    </div>
  </div>

  <script>
    let wallRecords = [];
    let activeCat = 'ALL';
    let map = null;

    async function fetchWallData() {
      try {
        const res = await fetch('/api/memorials');
        if (res.ok) {
          const data = await res.json();
          wallRecords = data.records || [];
        } else {
          const latestRes = await fetch('/latest');
          if (latestRes.ok) {
            const rec = await latestRes.json();
            wallRecords = [rec];
          }
        }
        renderGrid();
      } catch (err) {
        console.error("Wall data fetch error:", err);
      }
    }

    function renderGrid() {
      const grid = document.getElementById('wallGrid');
      const search = document.getElementById('searchBox').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = wallRecords.filter(r => {
        const matchesCat = activeCat === 'ALL' || r.category === activeCat;
        const matchesSearch = (r.name || '').toLowerCase().includes(search) || (r.agency || '').toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--muted); padding: 3rem;">No approved memorial records found yet.</p>`;
        return;
      }

      filtered.forEach(r => {
        const card = document.createElement('div');
        card.className = 'memorial-card';
        card.innerHTML = `
          <div>
            <span class="category-tag tag-${r.category}">${r.category.replace('_', ' ')}</span>
            <small style="float: right; color: var(--muted);">ID #${r.id}</small>
            <h3>${r.name}</h3>
            <div style="color: var(--muted); margin-bottom: 0.75rem;">🏛️ ${r.agency} • EOW: ${r.date_of_death || 'Line of Duty'}</div>
            <div style="font-size: 0.95rem; color: #c9d1d9; margin-bottom: 1.25rem;">${r.ai_memorial_text || r.summary || ''}</div>
          </div>
          <div class="card-actions">
            <button class="candle-button" onclick="lightVirtualCandle(${r.id}, event)">🕯️ Light Candle (<span id="cCount-${r.id}">${r.candle_count || 0}</span>)</button>
            <a href="/responders/${r.id}/certificate" target="_blank" style="color: var(--gold); font-size: 0.85rem; font-weight:600;">📜 Certificate</a>
            <button style="background:none; border:none; color:var(--text); cursor:pointer; font-weight:600;" onclick="openDrawer(${r.id})">Details 📖</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function switchView(view, btn) {
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (view === 'map') {
        document.getElementById('wallGrid').style.display = 'none';
        document.getElementById('controlsBar').style.display = 'none';
        document.getElementById('mapContainer').style.display = 'block';
        initMap();
      } else {
        document.getElementById('wallGrid').style.display = 'grid';
        document.getElementById('controlsBar').style.display = 'flex';
        document.getElementById('mapContainer').style.display = 'none';
      }
    }

    function initMap() {
      if (!map) {
        map = L.map('mapContainer').setView([37.0902, -95.7129], 4);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        wallRecords.forEach(r => {
          const lat = r.latitude || (37.0902 + (Math.random() - 0.5) * 10);
          const lng = r.longitude || (-95.7129 + (Math.random() - 0.5) * 20);
          const marker = L.marker([lat, lng]).addTo(map);
          marker.bindPopup(`
            <strong style="color: #000;">${r.name}</strong><br>
            <small style="color: #333;">${r.agency}</small><br>
            <a href="/responders/${r.id}/certificate" target="_blank">📜 Honor Certificate</a>
          `);
        });
      }
    }

    async function lightVirtualCandle(id, event) {
      event.stopPropagation();
      try {
        const res = await fetch(`/responders/${id}/candle`, { method: 'POST' });
        if (res.ok) {
          const data = await res.json();
          document.getElementById(`cCount-${id}`).innerText = data.candle_count;
        }
      } catch(e){}
    }

    function openDrawer(id) {
      const rec = wallRecords.find(r => r.id === id);
      if (!rec) return;
      document.getElementById('drawerHeader').innerHTML = `<h2 style="color: var(--gold);">${rec.name}</h2><p style="color: var(--muted);">${rec.agency}</p>`;
      document.getElementById('drawerBody').innerHTML = `<p style="white-space: pre-line;">${rec.ai_memorial_text || rec.summary}</p>`;
      document.getElementById('drawerModal').classList.add('active');
    }

    function closeDrawer() { document.getElementById('drawerModal').classList.remove('active'); }
    function selectCategory(cat) { activeCat = cat; renderGrid(); }
    function filterWall() { renderGrid(); }
    window.onload = fetchWallData;
  </script>
</body>
</html>
