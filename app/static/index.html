<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    :root {
      --bg-dark: #05070a;
      --card-bg: rgba(14, 20, 31, 0.9);
      --card-border: rgba(229, 192, 123, 0.25);
      --gold: #e5c07b;
      --gold-glow: rgba(229, 192, 123, 0.35);
      --blue: #4d93ff;
      --green: #2ea043;
      --text: #f0f6fc;
      --muted: #8b949e;
      --font-serif: 'Cinzel', serif;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(20, 35, 65, 0.6) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(50, 10, 60, 0.5) 0px, transparent 50%);

      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 3.5rem 1.5rem 2.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      background: rgba(6, 10, 16, 0.8);
      position: relative;
    }

    header h1 {
      font-family: var(--font-serif);
      font-size: 2.85rem;
      color: var(--gold);
      letter-spacing: 4px;

    }

    header p {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 750px;
      margin: 0 auto 1.5rem;
    }

    /* Hero Live Analytics Bar */
    .hero-stats-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    .hero-stat-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(229, 192, 123, 0.2);
      border-radius: 16px;
      padding: 0.75rem 1.5rem;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .hero-stat-val {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--gold);
    }

    .hero-stat-lbl {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .chime-btn {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: rgba(229, 192, 123, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.25s ease;
    }

    .chime-btn:hover {
      background: var(--gold);
      color: #000;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .view-toggles {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .toggle-btn {
      padding: 0.75rem 1.5rem;
      border-radius: 30px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .toggle-btn.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
      box-shadow: 0 0 15px var(--gold-glow);
    }

    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1.5rem;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 1.05rem;
      backdrop-filter: blur(10px);
      outline: none;
    }

    .chips-container { display: flex; flex-wrap: wrap; gap: 0.6rem; }

    .chip-btn {
      padding: 0.6rem 1.1rem;
      border-radius: 30px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
    }

    .chip-btn.active, .chip-btn:hover {

      color: #000;
      border-color: var(--gold);
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
      gap: 2rem;
    }

    .memorial-card {

      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 0;

      flex-direction: column;
      justify-content: space-between;

    .card-top-accent {

    .category-tag {

      box-shadow: 0 0 40px var(--gold-glow);
      border-radius: 24px;
      max-width: 750px;

      max-height: 90vh;
      overflow-y: auto;
      padding: 2.25rem;
      position: relative;
    }

    <!-- Cards Grid -->

    <!-- Map View -->

  </div>

    function playHonorChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 3);

        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 3);
      } catch (e){}
    }

    function getCoordsForRecord(r) {
      if (r.latitude && r.longitude) return [r.latitude, r.longitude];
      const text = `${r.agency || ''} ${r.summary || ''} ${r.name || ''}`.toUpperCase();

      for (const [city, coords] of Object.entries(MAJOR_CITIES_COORDS)) {
        if (text.includes(city)) return coords;
      }
      for (const [state, coords] of Object.entries(US_FULL_STATES)) {
        if (text.includes(state)) return coords;
      }
      for (const [code, coords] of Object.entries(US_STATE_CODES)) {
        const regex = new RegExp(`\\b${code}\\b`, 'i');
        if (regex.test(text)) return coords;
      }
      return [39.8283, -98.5795];
    }

    async function fetchWallData() {
      try {
        const res = await fetch('/api/memorials');
        if (res.ok) {
          const data = await res.json();
          wallRecords = data.records || [];
        } else {
          const latestRes = await fetch('/latest');
          if (latestRes.ok) {
            const rec = await latestRes.json();
            wallRecords = [rec];
          }
        }
        updateHeroStats();
        renderGrid();
      } catch (err) {
        console.error("Wall data fetch error:", err);
      }
    }

    function updateHeroStats() {
      document.getElementById('statHeroes').innerText = wallRecords.length;
      const cSum = wallRecords.reduce((acc, r) => acc + (r.candle_count || 0), 0);
      document.getElementById('statCandles').innerText = cSum;
    }

      const grid = document.getElementById('wallGrid');
      const search = document.getElementById('searchBox').value.toLowerCase();

      const filtered = wallRecords.filter(r => {
        const matchesCat = activeCat === 'ALL' || r.category === activeCat;
        const matchesSearch = (r.name || '').toLowerCase().includes(search) || (r.agency || '').toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--muted); padding: 3rem;">No approved memorial records found yet.</p>`;
        return;
      }

      filtered.forEach(r => {
        const card = document.createElement('div');
        card.className = 'memorial-card';
        const thumbUrl = r.photo_url || CATEGORY_THUMBNAILS[r.category] || CATEGORY_THUMBNAILS["OTHER"];

        const isVerified = r.nleomf_verified || r.odmp_verified || r.fire_hero_verified;
        const verBadgeHtml = isVerified ? `<div class="verification-chip">✅ NLEOMF & ODMP Verified Record</div>` : '';

        card.innerHTML = `
          <div class="card-top-accent"></div>
          <div class="card-body-padding">
            <div>
              <div class="card-top">
                <span class="category-tag tag-${r.category}">${r.category.replace('_', ' ')}</span>
                <img src="${thumbUrl}" class="card-thumb" alt="${r.category}">
              </div>
              <h3>${r.name}</h3>
              <div class="dept-line">🏛️ ${r.agency} • EOW: ${r.date_of_death || 'Line of Duty'}</div>
              ${verBadgeHtml}
              <div class="card-bio">${r.ai_memorial_text || r.summary || ''}</div>
            </div>
            <div class="card-actions">
              <button class="btn-candle" onclick="lightVirtualCandle(${r.id}, event)">🕯️ Candle (<span id="cCount-${r.id}">${r.candle_count || 0}</span>)</button>
              <a href="/responders/${r.id}/certificate" target="_blank" class="btn-cert">📜 Certificate</a>
              <button class="btn-details" onclick="openDrawer(${r.id})">Details 📖</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function switchView(view, btn) {
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (view === 'map') {
        document.getElementById('wallGrid').style.display = 'none';
        document.getElementById('controlsBar').style.display = 'none';
        document.getElementById('mapContainer').style.display = 'block';
        initMap();
      } else {
        document.getElementById('wallGrid').style.display = 'grid';
        document.getElementById('controlsBar').style.display = 'flex';
        document.getElementById('mapContainer').style.display = 'none';
      }
    }

    function initMap() {
      if (!map) {
        map = L.map('mapContainer').setView([37.0902, -95.7129], 4);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        wallRecords.forEach(r => {
          const coords = getCoordsForRecord(r);
          const marker = L.marker(coords).addTo(map);
          marker.bindPopup(`
            <strong style="color: #000;">${r.name}</strong><br>
            <small style="color: #333;">${r.agency}</small><br>
            <a href="/responders/${r.id}/certificate" target="_blank">📜 Honor Certificate</a>
          `);
        });
      }
    }

    async function lightVirtualCandle(id, event) {
      event.stopPropagation();
      try {
        const res = await fetch(`/responders/${id}/candle`, { method: 'POST' });
        if (res.ok) {
          const data = await res.json();
          document.getElementById(`cCount-${id}`).innerText = data.candle_count;
          const rec = wallRecords.find(r => r.id === id);
          if (rec) rec.candle_count = data.candle_count;
          updateHeroStats();
        } else {
          alert('You have already lit a virtual candle for this responder today.');
        }
      } catch(e){}
    }

    function openDrawer(id) {
      const rec = wallRecords.find(r => r.id === id);
      if (!rec) return;
      document.getElementById('drawerHeader').innerHTML = `<h2 style="color: var(--gold);">${rec.name}</h2><p style="color: var(--muted);">${rec.agency}</p>`;
      document.getElementById('drawerBody').innerHTML = `<p style="white-space: pre-line;">${rec.ai_memorial_text || rec.summary}</p>`;
      document.getElementById('drawerModal').classList.add('active');
    }

    function closeDrawer() { document.getElementById('drawerModal').classList.remove('active'); }
    function selectCategory(cat) { 
      activeCat = cat; 
      document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderGrid(); 
    }
    function filterWall() { renderGrid(); }
    window.onload = fetchWallData;
  </script>
</body>
</html>
